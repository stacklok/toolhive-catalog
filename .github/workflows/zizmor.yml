name: 'GitHub Actions Security (zizmor)'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: ./.github/workflows/
          advanced-security: 'false'
          annotations: 'true'
          # Low/informational findings (e.g. style nits, unexploitable
          # low-confidence flags) still show as annotations but don't fail
          # the check; only real security-relevant findings gate the PR.
          min-severity: medium
